
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Trugosia | Lobby</title>
</head>
<body>
    <main class="app-shell game-frame">
        <section id="loading-view" class="loading-view" aria-label="Chargement de Trugosia">
            <div class="loading-sigil" aria-hidden="true"><span>T</span></div>
            <p class="loading-kicker">TRUGOSIA // ONLINE</p>
            <h1>Chargement<span>...</span></h1>
            <div class="loading-track" aria-hidden="true"><span></span></div>
            <p class="loading-tip">Préparation du lobby</p>
        </section>

        <section id="auth-view" class="auth-view" aria-labelledby="brand-title">
            <div class="auth-topline"><span>SAISON 01</span><span>v1.0.4</span></div>
            <div class="brand-mark" aria-hidden="true">T</div>
            <p class="eyebrow">NEON FRONTIER</p>
            <h1 id="brand-title">Trugosia</h1>
            <p class="intro">Entrez dans la zone.</p>

            <div class="auth-card">
                <div class="tabs" role="tablist" aria-label="Authentification">
                    <button class="tab is-active" type="button" role="tab" aria-selected="true" data-mode="login">Se connecter</button>
                    <button class="tab" type="button" role="tab" aria-selected="false" data-mode="register">Créer un compte</button>
                </div>

                <form id="login-form" class="auth-form">
                    <div class="field">
                        <label for="login-identifier">Identifiant</label>
                        <input id="login-identifier" name="identifier" type="text" autocomplete="username" placeholder="votre identifiant" required>
                    </div>
                    <div class="field">
                        <label for="login-password">Mot de passe</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="votre mot de passe" required>
                    </div>
                    <button class="primary-button" type="submit">Lancer la partie <span aria-hidden="true">→</span></button>
                </form>

                <form id="register-form" class="auth-form is-hidden">
                    <div class="field">
                        <label for="register-identifier">Choisissez un identifiant</label>
                        <input id="register-identifier" name="identifier" type="text" autocomplete="username" placeholder="ex. alexandre" minlength="3" required>
                    </div>
                    <div class="field">
                        <label for="register-password">Choisissez un mot de passe</label>
                        <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="6 caractères minimum" minlength="6" required>
                    </div>
                    <button class="primary-button" type="submit">Rejoindre Trugosia <span aria-hidden="true">→</span></button>
                </form>
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
            </div>
            <p class="security-note"><span aria-hidden="true">◈</span> Connexion sécurisée // données locales</p>
        </section>

        <section id="lobby-view" class="lobby-view is-hidden" aria-labelledby="lobby-title">
            <header class="lobby-header">
                <div class="header-brand"><span class="brand-glyph" aria-hidden="true">T</span><span>TRUGOSIA</span></div>
                <div class="header-status"><span class="status-dot"></span> SERVEURS EN LIGNE</div>
                <button id="logout-button" class="icon-button logout-button" type="button" aria-label="Se déconnecter" title="Se déconnecter">↪</button>
            </header>

            <div class="lobby-content">
                <div class="lobby-heading"><p class="eyebrow">SECTEUR 07 // LOBBY</p><h2 id="lobby-title">CHOISIS TON<br><em>AVENTURE.</em></h2><p id="welcome-user" class="welcome-user"></p></div>

                <div class="character-stage" aria-label="Votre personnage 3D">
                    <div class="stage-ring ring-back"></div><div class="stage-ring ring-front"></div>
                    <div class="character" id="character" tabindex="0" role="img" aria-label="Personnage Trugosia, faire tourner avec les flèches">
                        <div class="character-shadow"></div><div class="character-body"><div class="body-panel"></div><div class="body-light"></div></div>
                        <div class="character-head"><span class="visor"></span><span class="ear ear-left"></span><span class="ear ear-right"></span></div>
                        <div class="character-arm arm-left"></div><div class="character-arm arm-right"></div><div class="character-leg leg-left"></div><div class="character-leg leg-right"></div>
                    </div>
                    <div class="character-label"><span class="label-line"></span><span>ÉQUIPEMENT // PRÊT</span></div>
                </div>

                <div class="lobby-actions">
                    <div class="left-actions"><button id="wallet-button" class="utility-button" type="button"><span class="action-icon">$</span><span><strong id="wallet-balance">1 250</strong><small>crédits</small></span></button><button id="store-button" class="utility-button" type="button"><span class="action-icon">▦</span><span>magasin<small>objets &amp; skins</small></span></button></div>
                    <button id="play-button" class="play-button" type="button"><span class="play-pulse"></span><span class="play-copy"><small>PROCHAIN MATCH</small><strong>JOUER</strong></span><span class="play-arrow" aria-hidden="true">↗</span></button>
                </div>
            </div>

            <nav class="lobby-nav" aria-label="Navigation du lobby">
                <button id="profile-button" class="nav-button profile-button" type="button"><span class="avatar avatar-player">T</span><span>profil</span></button>
                <button id="friends-button" class="nav-button" type="button"><span class="nav-symbol">+</span><span>ajouter</span><small>amis</small></button>
                <button id="teams-button" class="nav-button" type="button"><span class="nav-symbol">◈</span><span>équipe</span><small>escouade</small></button>
            </nav>
        </section>

        <div id="panel-backdrop" class="panel-backdrop is-hidden"></div>
        <aside id="lobby-panel" class="lobby-panel is-hidden" aria-live="polite" aria-label="Panneau du lobby">
            <button id="panel-close" class="panel-close" type="button" aria-label="Fermer">×</button>
            <div id="panel-content"></div>
        </aside>
    </main>
    <script src="script.js"></script>
</body>
</html>
